<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --info-color: #17a2b8;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --bg-light: #f4f7f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            --border-radius: 0.75rem;
        }

        body {
            background-color: #e9f5ff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .form-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .form-title {
            color: var(--primary-color);
            font-weight: 600;
        }

        .form-subtitle {
            color: var(--secondary-color);
        }

        .card-header h5 {
            color: var(--dark-color);
            font-weight: 500;
        }

        .card {
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
        }

        .progress-bar {
            background-color: var(--success-color);
            transition: width 0.6s ease;
        }

        .form-section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--dark-color);
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 0.5rem;
        }

        .input-group-text {
            background-color: var(--primary-color);
            color: #fff;
            border: 1px solid var(--primary-color);
            border-radius: 0.375rem 0 0 0.375rem;
        }

        .form-control,
        .form-select {
            border-radius: 0.375rem;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25);
        }

        .form-check-label {
            color: var(--dark-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.2);
        }

        .upload-card {
            border: 2px dashed #e9ecef;
            border-radius: var(--border-radius);
            text-align: center;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-card:hover {
            background-color: #f8f9fa;
            border-color: var(--primary-color);
        }

        .file-input {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container-xxl flex-grow-1 container-p-y">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="form-container">
                    <div class="form-header text-center">
                        <h2 class="form-title">📝 Pharmacy Registration</h2>
                        <p class="form-subtitle">Register your pharmacy to join our network.</p>
                    </div>

                    <div class="card mb-4">
                        <div class="card-body">
                            <form id="pharmacyRegistrationForm" method="POST" enctype="multipart/form-data">

                                <div class="row g-3">
                                    <div class="col-12">
                                        <h5 class="form-section-title">🏥 Pharmacy Information</h5>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="pharmacyName" class="form-label">Pharmacy Name <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="pharmacyName" name="pharmacyName"
                                            placeholder="e.g., MediCare Pharmacy" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="email" class="form-label">Email Address <span
                                                class="text-danger">*</span></label>
                                        <input type="email" class="form-control" id="email" name="email"
                                            placeholder="pharmacy@example.com" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="phoneNumber" class="form-label">Phone Number <span
                                                class="text-danger">*</span></label>
                                        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                                            placeholder="(123) 456-7890" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="licenseNumber" class="form-label">License Number <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="licenseNumber"
                                            name="licenseNumber" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="regAuthority" class="form-label">Registration Authority <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="regAuthority"
                                            name="regAuthority" placeholder="e.g., Pharmacy Council">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="yearsInOp" class="form-label">Years in Operation</label>
                                        <input type="number" class="form-control" id="yearsInOp" name="yearsInOp"
                                            min="0">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="dateRegistered" class="form-label">Date Registered</label>
                                        <input type="date" class="form-control" id="dateRegistered"
                                            name="dateRegistered">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="ownerName" class="form-label">Owner/Manager Full Name <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="ownerName" name="ownerName"
                                            required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="ownerGender" class="form-label">Owner/Manager Gender</label>
                                        <select class="form-select" id="ownerGender" name="ownerGender">
                                            <option value="">Select Gender</option>
                                            <option value="male">Male</option>
                                            <option value="female">Female</option>
                                            <option value="other">Other</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="contactPersonPhone" class="form-label">Contact Person's Phone <span
                                                class="text-danger">*</span></label>
                                        <input type="tel" class="form-control" id="contactPersonPhone"
                                            name="contactPersonPhone" required>
                                    </div>
                                </div>

                                ---

                                <div class="row g-3">
                                    <div class="col-12">
                                        <h5 class="form-section-title">📍 Address & Location</h5>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="physicalAddress" class="form-label">Physical Address <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="physicalAddress"
                                            name="physicalAddress" placeholder="e.g., 123 Main Street" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="city" class="form-label">City / Town <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="city" name="city" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="country" class="form-label">Country <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="country" name="country"
                                            required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="postalCode" class="form-label">Postal Code</label>
                                        <input type="text" class="form-control" id="postalCode" name="postalCode">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="googleMapsLink" class="form-label">Google Maps Link (Optional)</label>
                                        <input type="url" class="form-control" id="googleMapsLink"
                                            name="googleMapsLink">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="latitude" class="form-label">Latitude (Optional)</label>
                                        <input type="text" class="form-control" id="latitude" name="latitude">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="longitude" class="form-label">Longitude (Optional)</label>
                                        <input type="text" class="form-control" id="longitude" name="longitude">
                                    </div>
                                </div>

                                ---

                                <div class="row g-3">
                                    <div class="col-12">
                                        <h5 class="form-section-title">⏰ Operating Details</h5>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="openingDays" class="form-label">Opening Days</label>
                                        <input type="text" class="form-control" id="openingDays" name="openingDays"
                                            placeholder="e.g., Monday to Saturday">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="openingHours" class="form-label">Opening Hours</label>
                                        <input type="text" class="form-control" id="openingHours" name="openingHours"
                                            placeholder="e.g., 8:00 AM – 8:00 PM">
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check mt-3">
                                            <input class="form-check-input" type="checkbox" id="emergencyHours"
                                                name="emergencyHours">
                                            <label class="form-check-label" for="emergencyHours">
                                                Emergency / 24-Hour Service
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check mt-3">
                                            <input class="form-check-input" type="checkbox" id="onlineOrders"
                                                name="onlineOrders">
                                            <label class="form-check-label" for="onlineOrders">
                                                Online Orders Supported
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check mt-3">
                                            <input class="form-check-input" type="checkbox" id="deliveryAvailable"
                                                name="deliveryAvailable">
                                            <label class="form-check-label" for="deliveryAvailable">
                                                Delivery Available
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label for="serviceAreas" class="form-label">Service Areas</label>
                                        <input type="text" class="form-control" id="serviceAreas" name="serviceAreas"
                                            placeholder="e.g., City 1, City 2, etc.">
                                    </div>
                                </div>

                                ---

                                <div class="row g-3">
                                    <div class="col-12">
                                        <h5 class="form-section-title">📄 Document Uploads</h5>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="pharmacyLicense" class="form-label">Pharmacy License / Permit <span
                                                class="text-danger">*</span></label>
                                        <input class="form-control" type="file" id="pharmacyLicense"
                                            name="pharmacyLicense" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="ownerId" class="form-label">Owner’s ID / CAC Certificate <span
                                                class="text-danger">*</span></label>
                                        <input class="form-control" type="file" id="ownerId" name="ownerId" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="storeFrontPhoto" class="form-label">Store Front Photo (Optional)</label>
                                        <input class="form-control" type="file" id="storeFrontPhoto"
                                            name="storeFrontPhoto">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="interiorPhoto" class="form-label">Interior/Storage Photo (Optional)</label>
                                        <input class="form-control" type="file" id="interiorPhoto"
                                            name="interiorPhoto">
                                    </div>
                                </div>

                                ---

                                <div class="row g-3">
                                    <div class="col-12">
                                        <h5 class="form-section-title">🔒 Login Credentials</h5>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="loginEmail" class="form-label">Email Address / Username <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="loginEmail" name="loginEmail"
                                            required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="password" class="form-label">Password <span
                                                class="text-danger">*</span></label>
                                        <input type="password" class="form-control" id="password" name="password"
                                            required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="confirmPassword" class="form-label">Confirm Password <span
                                                class="text-danger">*</span></label>
                                        <input type="password" class="form-control" id="confirmPassword"
                                            name="confirmPassword" required>
                                    </div>
                                </div>

                                <div class="col-12 d-grid mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg">
                                        <i class="fa fa-plus-circle me-2"></i> Register Pharmacy
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Optional JavaScript for form validation or other dynamic behavior
        document.getElementById('pharmacyRegistrationForm').addEventListener('submit', function (e) {
            // Simple check for password match
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match. Please try again.");
                e.preventDefault();
            }
        });
    </script>
</body>

</html>
